rules:
  # ============================================================
  # COMMAND INJECTION
  # ============================================================

  - id: python-shell-true
    message: Avoid subprocess with shell=True
    severity: ERROR
    languages:
      - python
    patterns:
      - pattern: subprocess.run(..., shell=True, ...)
    metadata:
      category: Command Injection

  - id: python-os-system
    message: Avoid os.system() with user-controlled or untrusted input
    severity: ERROR
    languages:
      - python
    pattern: os.system(...)
    metadata:
      category: Command Injection

  - id: python-os-popen
    message: Avoid os.popen() for executing system commands
    severity: ERROR
    languages:
      - python
    pattern: os.popen(...)
    metadata:
      category: Command Injection


  # ============================================================
  # CODE INJECTION
  # ============================================================

  - id: python-eval
    message: Avoid using eval()
    severity: ERROR
    languages:
      - python
    pattern: eval(...)
    metadata:
      category: Code Injection

  - id: python-exec
    message: Avoid using exec()
    severity: ERROR
    languages:
      - python
    pattern: exec(...)
    metadata:
      category: Code Injection

  - id: python-compile
    message: Avoid dynamically compiling untrusted code
    severity: ERROR
    languages:
      - python
    pattern: compile(...)
    metadata:
      category: Code Injection


  # ============================================================
  # INSECURE DESERIALIZATION
  # ============================================================

  - id: pickle-load
    message: Unsafe pickle deserialization
    severity: ERROR
    languages:
      - python
    pattern: pickle.loads(...)
    metadata:
      category: Insecure Deserialization

  - id: pickle-load-file
    message: Unsafe pickle file deserialization
    severity: ERROR
    languages:
      - python
    pattern: pickle.load(...)
    metadata:
      category: Insecure Deserialization

  - id: yaml-unsafe-load
    message: Unsafe YAML deserialization
    severity: ERROR
    languages:
      - python
    pattern: yaml.load(...)
    metadata:
      category: Insecure Deserialization


  # ============================================================
  # CRYPTOGRAPHY
  # ============================================================

  - id: python-md5
    message: MD5 is cryptographically weak and should not be used for security-sensitive hashing
    severity: WARNING
    languages:
      - python
    pattern: hashlib.md5(...)
    metadata:
      category: Weak Cryptography

  - id: python-sha1
    message: SHA-1 is cryptographically weak and should not be used for security-sensitive hashing
    severity: WARNING
    languages:
      - python
    pattern: hashlib.sha1(...)
    metadata:
      category: Weak Cryptography


  # ============================================================
  # INSECURE TLS
  # ============================================================

  - id: python-requests-verify-false
    message: TLS certificate verification is disabled
    severity: ERROR
    languages:
      - python
    pattern: requests.$METHOD(..., verify=False, ...)
    metadata:
      category: Insecure Transport


  # ============================================================
  # FLASK SECURITY
  # ============================================================

  - id: flask-debug
    message: Flask debug mode enabled
    severity: WARNING
    languages:
      - python
    pattern: app.run(..., debug=True, ...)
    metadata:
      category: Security Misconfiguration


  # ============================================================
  # SQL INJECTION
  # ============================================================

  - id: python-sql-concat
    message: Potential SQL injection through string concatenation
    severity: ERROR
    languages:
      - python
    patterns:
      - pattern-either:
          - pattern: $CURSOR.execute($QUERY + $INPUT)
          - pattern: $CURSOR.execute($INPUT + $QUERY)
    metadata:
      category: SQL Injection
      cwe: CWE-89

  - id: python-sql-fstring
    message: Potential SQL injection through f-string SQL construction
    severity: ERROR
    languages:
      - python
    pattern: $CURSOR.execute(f"...")
    metadata:
      category: SQL Injection
      cwe: CWE-89

  - id: python-sql-format
    message: Potential SQL injection through string formatting
    severity: ERROR
    languages:
      - python
    patterns:
      - pattern-either:
          - pattern: $CURSOR.execute("...".format(...))
          - pattern: $CURSOR.execute($QUERY.format(...))
    metadata:
      category: SQL Injection
      cwe: CWE-89

  # ============================================================
  # PATH TRAVERSAL / UNSAFE FILE ACCESS
  # ============================================================

  - id: python-open-user-path
    message: File path may be constructed from untrusted input
    severity: ERROR
    languages:
      - python
    pattern: open($PATH, ...)
    metadata:
      category: Path Traversal
      cwe: CWE-22

  - id: python-file-user-path
    message: Filesystem operation may use an untrusted path
    severity: ERROR
    languages:
      - python
    patterns:
      - pattern-either:
          - pattern: os.remove($PATH)
          - pattern: os.unlink($PATH)
          - pattern: os.rename($PATH, ...)
          - pattern: shutil.copy($PATH, ...)
          - pattern: shutil.move($PATH, ...)
    metadata:
      category: Path Traversal
      cwe: CWE-22

  # ============================================================
  # SERVER-SIDE REQUEST FORGERY
  # ============================================================

  - id: python-requests-user-url
    message: Potential SSRF through dynamically supplied request URL
    severity: ERROR
    languages:
      - python
    patterns:
      - pattern-either:
          - pattern: requests.get($URL, ...)
          - pattern: requests.post($URL, ...)
          - pattern: requests.put($URL, ...)
          - pattern: requests.delete($URL, ...)
          - pattern: requests.request(..., url=$URL, ...)
    metadata:
      category: SSRF
      cwe: CWE-918

  # ============================================================
  # CROSS-SITE SCRIPTING
  # ============================================================

  - id: flask-markup
    message: Potential cross-site scripting through unsafe HTML markup
    severity: ERROR
    languages:
      - python
    pattern: markupsafe.Markup(...)
    metadata:
      category: Cross-Site Scripting
      cwe: CWE-79

  - id: flask-mark-safe
    message: Potential cross-site scripting through unsafe HTML rendering
    severity: ERROR
    languages:
      - python
    pattern: mark_safe(...)
    metadata:
      category: Cross-Site Scripting
      cwe: CWE-79
      